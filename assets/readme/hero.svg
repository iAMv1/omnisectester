<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OmniSec Tester - nation-state grade security testing framework running scan output in a terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="0.55" stop-color="#0d1320"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00e5a0"/>
      <stop offset="1" stop-color="#00b386"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#152033" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)" opacity="0.5"/>

  <!-- Status badge top -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <rect x="60" y="40" width="200" height="26" rx="13" fill="#101a2c" stroke="#00e5a0" stroke-opacity="0.4"/>
    <circle cx="82" cy="53" r="4" fill="#00e5a0" filter="url(#glow)"/>
    <text x="94" y="58" fill="#00e5a0" letter-spacing="1">SYSTEM: ONLINE</text>
  </g>

  <!-- Terminal window (right) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="620" y="90" width="500" height="420" rx="12" fill="#0f1420" stroke="#1f2b42"/>
    <rect x="620" y="90" width="500" height="40" rx="12" fill="#141b2b"/>
    <rect x="620" y="112" width="500" height="18" fill="#141b2b"/>
    <circle cx="640" cy="110" r="6" fill="#ff5c8a"/>
    <circle cx="660" cy="110" r="6" fill="#ffb100"/>
    <circle cx="680" cy="110" r="6" fill="#00e5a0"/>
    <text x="700" y="115" fill="#5b6b82" font-size="13">omnisectester — zsh</text>
    <text x="640" y="160" fill="#5b6b82" font-size="15">$ omnisectester scan web --target https://app.io</text>
    <text x="640" y="200" fill="#d7e3f4" font-size="15"><tspan fill="#00e5a0">[✓]</tspan>  THREAT MODEL    STRIDE · PASTA · ATT&amp;CK</text>
    <text x="640" y="235" fill="#d7e3f4" font-size="15"><tspan fill="#00e5a0">[✓]</tspan>  BUSINESS LOGIC  race · state · auth-chain</text>
    <text x="640" y="270" fill="#d7e3f4" font-size="15"><tspan fill="#00e5a0">[✓]</tspan>  SUPPLY CHAIN    SBOM · CI/CD · artifacts</text>
    <text x="640" y="305" fill="#d7e3f4" font-size="15"><tspan fill="#00e5a0">[✓]</tspan>  CLOUD           IAM · metadata · k8s</text>
    <text x="640" y="340" fill="#d7e3f4" font-size="15"><tspan fill="#00e5a0">[✓]</tspan>  AI / LLM        injection · jailbreak</text>
    <text x="640" y="375" fill="#d7e3f4" font-size="15"><tspan fill="#00e5a0">[✓]</tspan>  HARDWARE        UEFI · TEE · JTAG</text>
    <text x="640" y="412" fill="#5b6b82" font-size="15">────────────────────────────────────</text>
    <text x="640" y="448" fill="#ff5c8a" font-size="15"><tspan fill="#ff5c8a">[!]</tspan>  CRITICAL 2 · HIGH 4 · OPEN 1 ATTACK PATH</text>
    <text x="640" y="482" fill="#00e5a0" font-size="15">▮▮ Publish: omnisectester@2.0.3</text>
  </g>

  <!-- Title + value (left) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="180" fill="#d7e3f4" font-size="22" font-weight="700" letter-spacing="7">OMNISEC</text>
    <text x="60" y="228" fill="#00e5a0" font-size="66" font-weight="800" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Tester</text>
    <text x="60" y="300" fill="#d7e3f4" font-size="20" font-weight="400">
      Nation-state grade security testing
    </text>
    <text x="60" y="334" fill="#d7e3f4" font-size="20" font-weight="400">
      across <tspan fill="#ffb100" font-weight="700">every attack surface</tspan> —
    </text>
    <text x="60" y="368" fill="#d7e3f4" font-size="20" font-weight="400">one CLI.</text>

    <!-- Key stats -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <rect x="60" y="410" width="150" height="52" rx="8" fill="#101a2c" stroke="#1f2b42"/>
      <text x="74" y="435" fill="#00e5a0" font-size="20" font-weight="700">130+</text>
      <text x="74" y="453" fill="#5b6b82" font-size="12">scan categories</text>
      <rect x="224" y="410" width="150" height="52" rx="8" fill="#101a2c" stroke="#1f2b42"/>
      <text x="238" y="435" fill="#00e5a0" font-size="20" font-weight="700">4</text>
      <text x="238" y="453" fill="#5b6b82" font-size="12">compliance maps</text>
      <rect x="388" y="410" width="150" height="52" rx="8" fill="#101a2c" stroke="#1f2b42"/>
      <text x="402" y="435" fill="#00e5a0" font-size="20" font-weight="700">3-pillar</text>
      <text x="402" y="453" fill="#5b6b82" font-size="12">CVSS · EPSS · SSVC</text>
    </g>
  </g>

  <!-- CTA bar bottom-left -->
  <a href="https://www.npmjs.com/package/omnisectester">
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
      <rect x="60" y="500" width="300" height="48" rx="8" fill="url(#accent)"/>
      <text x="84" y="531" fill="#08120e" font-weight="700">npm install -g omnisectester</text>
    </g>
  </a>
</svg>

