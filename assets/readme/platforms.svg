<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OmniSec Tester scans web, extensions, desktop, mobile, cloud, supply chain, AI/LLM, firmware, and network from one CLI">
  <defs>
    <linearGradient id="bgP" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#0d1320"/>
    </linearGradient>
    <pattern id="gridP" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#152033" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bgP)"/>
  <rect width="1200" height="300" fill="url(#gridP)" opacity="0.4"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="55" fill="#d7e3f4" font-size="26" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/ one CLI · every surface</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <!-- Row 1 -->
    <rect x="40" y="85" width="260" height="80" rx="8" fill="#0f1420" stroke="#1f2b42"/>
    <text x="60" y="118" fill="#00e5a0" font-weight="700">WEB</text>
    <text x="60" y="142" fill="#5b6b82" font-size="12">REST · GraphQL · WS</text>

    <rect x="320" y="85" width="260" height="80" rx="8" fill="#0f1420" stroke="#1f2b42"/>
    <text x="340" y="118" fill="#00e5a0" font-weight="700">EXTENSION</text>
    <text x="340" y="142" fill="#5b6b82" font-size="12">Chrome · Firefox · Edge</text>

    <rect x="600" y="85" width="260" height="80" rx="8" fill="#0f1420" stroke="#1f2b42"/>
    <text x="620" y="118" fill="#00e5a0" font-weight="700">DESKTOP</text>
    <text x="620" y="142" fill="#5b6b82" font-size="12">Electron · Qt · native</text>

    <rect x="880" y="85" width="280" height="80" rx="8" fill="#0f1420" stroke="#1f2b42"/>
    <text x="900" y="118" fill="#00e5a0" font-weight="700">MOBILE</text>
    <text x="900" y="142" fill="#5b6b82" font-size="12">Android APK · iOS IPA</text>

    <!-- Row 2 -->
    <rect x="40" y="185" width="260" height="80" rx="8" fill="#101a2c" stroke="#1f2b42"/>
    <text x="60" y="218" fill="#ffb100" font-weight="700">CLOUD</text>
    <text x="60" y="242" fill="#5b6b82" font-size="12">AWS · Azure · GCP · k8s</text>

    <rect x="320" y="185" width="260" height="80" rx="8" fill="#101a2c" stroke="#1f2b42"/>
    <text x="340" y="218" fill="#ffb100" font-weight="700">SUPPLY CHAIN</text>
    <text x="340" y="242" fill="#5b6b82" font-size="12">SBOM · CI/CD · artifacts</text>

    <rect x="600" y="185" width="260" height="80" rx="8" fill="#101a2c" stroke="#1f2b42"/>
    <text x="620" y="218" fill="#ffb100" font-weight="700">AI / LLM</text>
    <text x="620" y="242" fill="#5b6b82" font-size="12">injection · RAG · jailbreak</text>

    <rect x="880" y="185" width="280" height="80" rx="8" fill="#101a2c" stroke="#1f2b42"/>
    <text x="900" y="218" fill="#ffb100" font-weight="700">FIRMWARE + NETWORK</text>
    <text x="900" y="242" fill="#5b6b82" font-size="12">UEFI · TEE · TLS · BGP</text>
  </g>
</svg>

