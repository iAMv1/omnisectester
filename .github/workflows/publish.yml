name: Publish to npm (Trusted Publishing / OIDC)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # NOTE: no `registry-url` on purpose. setup-node would write an .npmrc
      # containing `_authToken=${NODE_AUTH_TOKEN}` which stays EMPTY (this
      # repo has no npm secret) and npm fails with ENEEDAUTH before it can
      # attempt the OIDC id-token exchange. npm >= 11.5 detects GitHub
      # Actions OIDC via the runner environment instead.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Bundled npm on the runner may predate 11.5 (where OIDC trusted
      # publishing landed). Force the latest npm so the id-token exchange
      # is supported, and print versions to make failures diagnosable.
      - name: Ensure npm >= 11.5 for OIDC support
        run: |
          npm install -g npm@latest
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Publish to npm (trusted publishing / OIDC)
        run: npm publish --provenance --access public

      - name: Verify publication
        run: npm info omnisectester

